<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Collaborators Around the World — Golnoush Haddadian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #f1f8fb;
    --card: #ffffff;
    --primary: #118ab2;
    --primary-deep: #0b6e8f;
    --advisor: #ef476f;
    --committee: #ffb703;
    --coauthor: #2a9d8f;
    --text: #1f2d3d;
    --muted: #6b7a8d;
    --line: #e4eef3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 40px; }
  .header { text-align: center; margin-bottom: 22px; }
  .kicker {
    display: inline-block;
    background: #fff;
    color: var(--primary-deep);
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    padding: 6px 14px;
    border-radius: 999px;
    box-shadow: 0 2px 10px rgba(17, 138, 178, 0.12);
    border: 1px solid var(--line);
  }
  h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 4.2vw, 42px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 14px 0 10px;
    color: var(--text);
  }
  h1 .accent { color: var(--primary); }
  .lede { color: var(--muted); max-width: 60ch; margin: 0 auto 20px; }
  .stats {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 12px; margin-bottom: 22px;
  }
  .chip {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    display: inline-flex; align-items: baseline; gap: 8px;
    box-shadow: 0 2px 8px rgba(17, 138, 178, 0.06);
  }
  .chip .num {
    font-family: 'Poppins', sans-serif;
    font-weight: 700; font-size: 20px; color: var(--primary);
  }
  .chip .lbl { color: var(--muted); font-size: 14px; font-weight: 600; }
  .map-card {
    background: var(--card);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 10px 30px -12px rgba(17, 138, 178, 0.25);
    border: 1px solid var(--line);
  }
  #map {
    height: 580px; width: 100%;
    border-radius: 12px;
    background: #e9f3f8;
    overflow: hidden;
  }
  .fallback {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); padding: 20px; text-align: center;
    font-weight: 600;
  }
  .marker-pin {
    border: 3px solid #fff;
    border-radius: 999px;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700; font-size: 14px; color: #fff;
    box-shadow: 0 3px 10px rgba(31, 45, 61, 0.35);
  }
  .leaflet-popup-content-wrapper {
    background: #fff; color: var(--text);
    border-radius: 14px;
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px -10px rgba(17, 138, 178, 0.3);
  }
  .leaflet-popup-content { margin: 14px 16px; }
  .leaflet-popup-tip { background: #fff; }
  .popup-city {
    font-family: 'Poppins', sans-serif;
    font-weight: 700; font-size: 17px; margin: 0;
    color: var(--text);
  }
  .popup-region {
    color: var(--primary); font-weight: 700; font-size: 13px;
    margin-bottom: 10px;
  }
  .popup-list { margin: 0; padding: 0; list-style: none; max-height: 260px; overflow-y: auto; }
  .popup-list li {
    padding: 8px 0; border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .popup-list li:first-child { border-top: 0; }
  .role-dot {
    flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%;
    margin-top: 6px;
  }
  .p-name { font-weight: 700; font-size: 14px; color: var(--text); }
  .p-meta { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  .legend {
    background: #fff;
    padding: 10px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(17, 138, 178, 0.18);
    border: 1px solid var(--line);
    font-size: 13px;
  }
  .legend .title {
    font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 12px; color: var(--text); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--text); }
  .legend-row .dot { width: 10px; height: 10px; border-radius: 50%; }
  footer.note {
    margin-top: 18px; text-align: center;
    font-size: 12.5px; color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <span class="kicker">Golnoush Haddadian · Research Network</span>
    <h1>My Collaborators <span class="accent">Around the World</span></h1>
    <p class="lede">A friendly map of the wonderful people I work with. Click any pin to meet the collaborators based there.</p>
    <div class="stats">
      <div class="chip"><span class="num" id="stat-people">—</span><span class="lbl">People</span></div>
      <div class="chip"><span class="num" id="stat-cities">—</span><span class="lbl">Cities</span></div>
      <div class="chip"><span class="num" id="stat-countries">—</span><span class="lbl">Countries</span></div>
    </div>
  </div>

  <div class="map-card">
    <div id="map"><div class="fallback">Loading map…</div></div>
  </div>

  <footer class="note">Map tiles © CARTO · Data © OpenStreetMap contributors · Built with Leaflet</footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Edit this single array to add, move, or update collaborators.
  const COLLABORATORS = [
    { city: "Atlanta", region: "Georgia, USA", lat: 33.7490, lng: -84.3880, country: "USA", people: [
      { name: "Min Kyu Kim", role: "Ph.D. advisor", meta: "Associate Professor, Learning Sciences, Georgia State University" },
      { name: "Joseph P. Magliano", role: "Postdoc mentor", meta: "Professor, Learning Sciences, Georgia State University" },
      { name: "Jonathan D. Cohen", role: "Postdoc mentor", meta: "Professor, Learning Sciences, Georgia State University" },
      { name: "Jennifer Darling-Aduana", role: "Dissertation committee", meta: "Assistant Professor, Learning Technologies, Georgia State University" },
      { name: "Saeid Motevali", role: "Co-author / Dissertation committee", meta: "Georgia State University" },
      { name: "Ben Rydal Shapiro", role: "Dissertation committee", meta: "Georgia State University" },
      { name: "Gertrude Tinker Sachs", role: "Co-author / IES project", meta: "Professor, Georgia State University" },
      { name: "Omer Ari", role: "Co-author / IES project", meta: "Clinical Associate Professor, Georgia State University" },
      { name: "Yoojin Bae", role: "Co-author", meta: "Doctoral student, Learning Sciences, Georgia State University" },
      { name: "Jinho Kim", role: "Co-author", meta: "Doctoral student, Learning Sciences, Georgia State University" },
      { name: "Hyunkyu Han", role: "Co-author", meta: "Doctoral student, Learning Sciences, Georgia State University" },
      { name: "Ali Heidari", role: "Co-author", meta: "Doctoral researcher, Learning Sciences, Georgia State University" },
      { name: "Nooshin Haddadian", role: "Co-author", meta: "Doctoral student, Learning Sciences, Georgia State University" }
    ]},
    { city: "Heerlen", region: "Netherlands", lat: 50.8882, lng: 5.9795, country: "Netherlands", people: [
      { name: "Seyyed Kazem Banihashem", role: "Co-author", meta: "Assistant Professor, Open University of the Netherlands (also Wageningen University & Research)" },
      { name: "Maryam Alqassab", role: "Co-author", meta: "Open University of the Netherlands" }
    ]},
    { city: "Wageningen", region: "Netherlands", lat: 51.9692, lng: 5.6654, country: "Netherlands", people: [
      { name: "Omid Noroozi", role: "Co-author", meta: "Associate Professor, Wageningen University & Research" },
      { name: "Xingshi (Xin) Gao", role: "Co-author", meta: "PhD candidate, Wageningen University & Research" }
    ]},
    { city: "Norfolk", region: "Virginia, USA", lat: 36.8508, lng: -76.2859, country: "USA", people: [
      { name: "Daniel (Dan) Takabi", role: "Co-author", meta: "Professor and Director, School of Cybersecurity, Old Dominion University" },
      { name: "Prajwal Panzade", role: "Co-author", meta: "Old Dominion University / Georgia State University" }
    ]},
    { city: "Nashville", region: "Tennessee, USA", lat: 36.1627, lng: -86.7816, country: "USA", people: [
      { name: "Scott A. Crossley", role: "Co-author", meta: "Professor, Vanderbilt University" }
    ]},
    { city: "Memphis", region: "Tennessee, USA", lat: 35.1495, lng: -90.0490, country: "USA", people: [
      { name: "John Sabatini", role: "Co-author / IES project", meta: "Distinguished Research Professor, University of Memphis" }
    ]},
    { city: "Pittsburgh", region: "Pennsylvania, USA", lat: 40.4406, lng: -79.9959, country: "USA", people: [
      { name: "Christian D. Schunn", role: "Co-author", meta: "Professor, University of Pittsburgh" }
    ]},
    { city: "Princeton", region: "New Jersey, USA", lat: 40.3573, lng: -74.6672, country: "USA", people: [
      { name: "Tenaha O'Reilly", role: "Co-author / IES project", meta: "Educational Testing Service (ETS)" }
    ]},
    { city: "Coral Gables", region: "Florida, USA", lat: 25.7215, lng: -80.2684, country: "USA", people: [
      { name: "Nam Ju Kim", role: "Co-author", meta: "Associate Professor, University of Miami" }
    ]},
    { city: "Augsburg", region: "Germany", lat: 48.3705, lng: 10.8978, country: "Germany", people: [
      { name: "Martin Greisel", role: "Co-author", meta: "Assistant Professor, Educational Psychology, University of Augsburg" }
    ]},
    { city: "Brisbane", region: "Australia", lat: -27.4698, lng: 153.0251, country: "Australia", people: [
      { name: "Hassan Khosravi", role: "Co-author", meta: "Associate Professor, University of Queensland" }
    ]},
    { city: "Tehran", region: "Iran", lat: 35.6892, lng: 51.3890, country: "Iran", people: [
      { name: "Behrooz Mahmoodi-Bakhtiari", role: "Co-author", meta: "Associate Professor, College of Fine Arts, University of Tehran" }
    ]}
  ];

  const ROLE_COLORS = {
    advisor: "#ef476f",
    committee: "#ffb703",
    coauthor: "#2a9d8f"
  };
  const ROLE_RANK = { advisor: 3, committee: 2, coauthor: 1 };

  function categorize(role) {
    const r = role.toLowerCase();
    if (r.includes("advisor") || r.includes("mentor")) return "advisor";
    if (r.includes("committee")) return "committee";
    return "coauthor";
  }

  function topCategory(people) {
    return people.reduce((top, p) => {
      const c = categorize(p.role);
      return ROLE_RANK[c] > ROLE_RANK[top] ? c : top;
    }, "coauthor");
  }

  // Stats
  const totalPeople = COLLABORATORS.reduce((s, c) => s + c.people.length, 0);
  document.getElementById('stat-people').textContent = totalPeople;
  document.getElementById('stat-cities').textContent = COLLABORATORS.length;
  document.getElementById('stat-countries').textContent = new Set(COLLABORATORS.map(c => c.country)).size;

  const mapEl = document.getElementById('map');

  if (typeof L === 'undefined') {
    mapEl.innerHTML = '<div class="fallback">We couldn\'t load the map right now. Please check your connection and refresh.</div>';
  } else {
    mapEl.innerHTML = '';
    const map = L.map('map', { scrollWheelZoom: false, worldCopyJump: true }).setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // English-only labels overlay (Esri Reference)
    L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Labels &copy; Esri',
      maxZoom: 19,
      pane: 'shadowPane'
    }).addTo(map);

    const bounds = [];

    COLLABORATORS.forEach(loc => {
      const cat = topCategory(loc.people);
      const color = ROLE_COLORS[cat];

      const icon = L.divIcon({
        className: 'collab-marker',
        html: `<div class="marker-pin" style="background:${color}">${loc.people.length}</div>`,
        iconSize: [36, 36],
        iconAnchor: [18, 18],
        popupAnchor: [0, -16]
      });

      const list = loc.people.map(p => {
        const c = categorize(p.role);
        return `
          <li>
            <span class="role-dot" style="background:${ROLE_COLORS[c]}"></span>
            <div>
              <div class="p-name">${p.name}</div>
              <div class="p-meta">${p.role} · ${p.meta}</div>
            </div>
          </li>`;
      }).join('');

      const popupHtml = `
        <div>
          <p class="popup-city">${loc.city}</p>
          <div class="popup-region">${loc.region}</div>
          <ul class="popup-list">${list}</ul>
        </div>`;

      L.marker([loc.lat, loc.lng], { icon })
        .addTo(map)
        .bindPopup(popupHtml, { maxWidth: 340, minWidth: 260 });

      bounds.push([loc.lat, loc.lng]);
    });

    if (bounds.length) map.fitBounds(bounds, { padding: [50, 50] });

    // Legend
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <div class="title">Role</div>
        <div class="legend-row"><span class="dot" style="background:${ROLE_COLORS.advisor}"></span>Advisor / mentor</div>
        <div class="legend-row"><span class="dot" style="background:${ROLE_COLORS.committee}"></span>Dissertation committee</div>
        <div class="legend-row"><span class="dot" style="background:${ROLE_COLORS.coauthor}"></span>Co-author</div>`;
      return div;
    };
    legend.addTo(map);

    setTimeout(() => map.invalidateSize(), 300);
    window.addEventListener('resize', () => map.invalidateSize());
  }
</script>
</body>
</html>
