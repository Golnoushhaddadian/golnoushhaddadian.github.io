<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(70% 55% at 50% 0%,rgba(75,116,179,.18),transparent 60%),
      radial-gradient(60% 50% at 50% 100%,rgba(76,182,171,.14),transparent 65%),
      linear-gradient(180deg,#0b0f1a,#080a10);
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:#FAFAF8;padding:24px}
  .card{width:min(400px,100%);border-radius:20px;padding:38px 36px 34px;border:1px solid transparent;text-align:center;
    background:linear-gradient(180deg,rgba(16,20,30,.97),rgba(9,11,17,.98)) padding-box,
      linear-gradient(125deg,rgba(76,182,171,.65),rgba(75,116,179,.35) 55%,rgba(180,223,220,.55)) border-box;
    box-shadow:0 30px 90px rgba(4,5,8,.6),0 0 44px rgba(76,182,171,.12)}
  .mark{width:34px;height:34px;margin:0 auto 18px;display:block}
  h1{font-size:19px;font-weight:650;letter-spacing:-.01em}
  h1 .ai{color:#4CB6AB}
  .tag{font-size:9px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#8FAEDC;margin:8px 0 26px}
  input{width:100%;padding:12px 14px;border-radius:10px;background:rgba(250,250,248,.05);
    border:1px solid rgba(250,250,248,.14);color:#FAFAF8;font-size:15px;text-align:center;letter-spacing:.35em}
  input:focus{outline:none;border-color:rgba(76,182,171,.65);box-shadow:0 0 0 3px rgba(76,182,171,.14)}
  button{margin-top:16px;width:100%;cursor:pointer;padding:12px 20px;border-radius:999px;color:#fff;
    font-family:'IBM Plex Mono',Menlo,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;border:1px solid transparent;
    background:linear-gradient(180deg,rgba(21,28,38,.9),rgba(11,14,22,.95)) padding-box,
      linear-gradient(120deg,rgba(76,182,171,.8),rgba(75,116,179,.5) 55%,rgba(180,223,220,.7)) border-box;
    transition:transform .25s,box-shadow .25s}
  button:hover{transform:translateY(-1px);box-shadow:0 0 22px rgba(76,182,171,.28)}
  .err{min-height:18px;font-size:11px;color:#E08A8A;margin-top:12px;opacity:0;transition:opacity .3s}
  .err.on{opacity:1}
  .busy{opacity:.6;pointer-events:none}
</style></head>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryPass(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(DATA.s),iterations:DATA.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(DATA.n)},key,b(DATA.c));
  return new TextDecoder().decode(pt);
}
async function unlock(pw,silent){
  const card=document.getElementById('card');
  card.classList.add('busy');
  try{
    const html=await tryPass(pw);
    try{sessionStorage.setItem('cx-key',pw);}catch(_){}
    document.open();document.write(html);document.close();
  }catch(_){
    card.classList.remove('busy');
    if(!silent){document.getElementById('e').classList.add('on');document.getElementById('p').value='';document.getElementById('p').focus();}
  }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('e').classList.remove('on');unlock(document.getElementById('p').value,false);});
try{const saved=sessionStorage.getItem('cx-key');if(saved)unlock(saved,true);}catch(_){}
</script>
